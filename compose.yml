

services:
  frontend:
    depends_on:
      - backend
    build: ./frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    develop:
      watch:
        - path: ./frontend/package.json
          action: rebuild
        - path: ./frontend/package-lock.json
          action: rebuild
        - path: ./frontend/src
          action: rebuild
          target: /src/src
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    develop:
      watch:
        - path: ./backend/package.json
          action: rebuild
        - path: ./backend/package-lock.json
          action: rebuild
        - path: ./backend/src
          action: rebuild
          target: /src/src

volumes:
  colabcode: